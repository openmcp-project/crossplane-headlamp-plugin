version: "3"

vars:
  CONTEXT: kind-headlamp-dev
  NAMESPACE: headlamp
  PLUGIN_DIR: headlamp_crossplane
  HEADLAMP_PLUGINS_DIR: "{{.HOME}}/Library/Preferences/Headlamp/plugins/headlamp-crossplane"

tasks:
  # ── Local desktop development (no cluster needed) ────────────────────────────

  mock:
    desc: "Start mock k8s API server — load in Headlamp as 'crossplane-mock' cluster. Scenario: small (default), medium, large."
    vars:
      SCENARIO: '{{default "small" .SCENARIO}}'
    cmds:
      - |
        # Kill any previous instance on the same port
        lsof -ti:9647 | xargs kill -9 2>/dev/null || true
      - |
        # Add mock cluster to kubeconfig if not already present
        if ! grep -q "crossplane-mock" ~/.kube/config 2>/dev/null; then
          node mock-cluster/server.mjs --print-kubeconfig >> ~/.kube/config
          echo "✓ Added 'crossplane-mock' to ~/.kube/config"
        fi
      - node mock-cluster/server.mjs --scenario {{.SCENARIO}}

  mock:medium:
    desc: "Start mock cluster with medium landscape (~30 resources)"
    cmds:
      - task: mock
        vars: { SCENARIO: medium }

  mock:large:
    desc: "Start mock cluster with large landscape (~120 resources, 4 providers)"
    cmds:
      - task: mock
        vars: { SCENARIO: large }

  dev:desktop:
    desc: "Build plugin and watch for changes — copies into Headlamp desktop app on each rebuild."
    cmds:
      - mkdir -p "{{.HEADLAMP_PLUGINS_DIR}}"
      - node node_modules/@kinvolk/headlamp-plugin/bin/headlamp-plugin.js start

  # ── In-cluster development (delegates to ui-frontend) ────────────────────────

  dev:
    desc: "Bootstrap local kind cluster via ui-frontend. Usage: task dev"
    cmds:
      - task -d ../ui-frontend headlamp:setup

  update:
    desc: "Build and hot-sync plugin into the running headlamp pod. Usage: task update"
    cmds:
      - npm run build
      - |
        POD=$(kubectl --context {{.CONTEXT}} get pod -n {{.NAMESPACE}} -l app.kubernetes.io/name=headlamp -o jsonpath='{.items[0].metadata.name}')
        if [[ -z "$POD" ]]; then
          echo "error: no headlamp pod found — run: task dev" >&2
          exit 1
        fi
        echo "→ syncing to pod ${POD}:/headlamp/plugins/{{.PLUGIN_DIR}}/ ..."
        kubectl --context {{.CONTEXT}} exec -n {{.NAMESPACE}} "${POD}" -- mkdir -p "/headlamp/plugins/{{.PLUGIN_DIR}}"
        kubectl --context {{.CONTEXT}} cp dist/main.js "{{.NAMESPACE}}/${POD}:/headlamp/plugins/{{.PLUGIN_DIR}}/main.js"
        kubectl --context {{.CONTEXT}} cp package.json "{{.NAMESPACE}}/${POD}:/headlamp/plugins/{{.PLUGIN_DIR}}/package.json"
        echo "✓ crossplane plugin synced — hard-refresh the browser to pick up changes"
