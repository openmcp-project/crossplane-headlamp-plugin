name: Release

on:
  workflow_dispatch:
    inputs:
      nextVersion:
        description: "Specify the release version in semver format v[major].[minor].[patch] e.g. v0.0.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - name: Check if tag already exists
        run: |
          if git rev-parse ${{ github.event.inputs.nextVersion }} >/dev/null 2>&1; then
            echo "Tag ${{ github.event.inputs.nextVersion }} already exists."
            exit 1
          else
            echo "Tag does not exist. Building release version ${{ github.event.inputs.nextVersion }}"
          fi

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Package plugin tar.gz for ArtifactHub
        run: |
          VERSION=${{ github.event.inputs.nextVersion }}
          SEMVER=${VERSION#v}
          mkdir -p package/headlamp-crossplane
          cp dist/main.js package/headlamp-crossplane/main.js
          cp package.json package/headlamp-crossplane/package.json
          tar -czf headlamp-crossplane-${SEMVER}.tar.gz -C package headlamp-crossplane
          echo "TARBALL=headlamp-crossplane-${SEMVER}.tar.gz" >> $GITHUB_ENV
          echo "SEMVER=${SEMVER}" >> $GITHUB_ENV

      - name: Write artifacthub-pkg.yml for this version
        run: |
          CHECKSUM=$(sha256sum ${{ env.TARBALL }} | awk '{print $1}')
          SEMVER=${{ env.SEMVER }}
          VERSION=${{ github.event.inputs.nextVersion }}
          TEMPLATE="artifacthub/0.0.2/artifacthub-pkg.yml"
          PKGFILE="artifacthub/${SEMVER}/artifacthub-pkg.yml"
          mkdir -p "artifacthub/${SEMVER}"
          cp "$TEMPLATE" "$PKGFILE"
          [ -f "artifacthub/0.0.2/README.md" ] && cp "artifacthub/0.0.2/README.md" "artifacthub/${SEMVER}/README.md"
          sed -i "s|version: .*|version: ${SEMVER}|" "$PKGFILE"
          sed -i "s|https://github.com/openmcp-project/[^/]*/releases/download/[^/]*/[^ ]*\.tar\.gz|https://github.com/openmcp-project/crossplane-headlamp-plugin/releases/download/${VERSION}/headlamp-crossplane-${SEMVER}.tar.gz|g" "$PKGFILE"
          sed -i "s|sha256:.*|sha256:${CHECKSUM}|" "$PKGFILE"
          echo "PKGFILE=${PKGFILE}" >> $GITHUB_ENV

      - name: Commit artifacthub-pkg.yml and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacthub/
          git diff --staged --quiet || git commit -m "chore: add artifacthub metadata for ${{ github.event.inputs.nextVersion }}"
          git pull --rebase origin main
          git tag ${{ github.event.inputs.nextVersion }}
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.nextVersion }}
          files: |
            dist/main.js
            ${{ env.TARBALL }}
          generate_release_notes: true
